name: Verify API and example

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test API, sources and Javadoc
        run: ./mvnw -B clean verify
      - name: Compile and test the example against the published API
        run: ./mvnw -B -f examples/pom.xml clean verify
